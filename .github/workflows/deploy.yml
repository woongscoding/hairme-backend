name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# 배포가 동시에 두 개 돌면 Lambda update 충돌(ResourceConflictException)이 나므로
# ref 단위로 직렬화한다. 진행 중인 배포를 취소하지는 않는다(중간에 끊기면 더 위험).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hairme-lambda-proxy
  LAMBDA_FUNCTION_NAME: hairme-analyze  # Android 앱이 호출하는 실제 Lambda

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Black/Flake8 실패는 배포를 차단한다 (과거 continue-on-error로 가려져 있던 것 수정)
      - name: Run Black (code formatting check)
        run: black --check .

      - name: Run Flake8 (linting)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy (type checking)
        run: mypy . --ignore-missing-imports
        continue-on-error: true  # Type errors tracked but not blocking

      - name: Run pytest
        env:
          GEMINI_API_KEY: test_key
          USE_DYNAMODB: false
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

  build-and-deploy:
    name: Build and Deploy to Lambda
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create backup tag of current Lambda version
        run: |
          CURRENT_IMAGE=$(aws lambda get-function \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION \
            --query 'Code.ImageUri' \
            --output text || echo "none")

          if [ "$CURRENT_IMAGE" != "none" ] && [ "$CURRENT_IMAGE" != "None" ]; then
            CURRENT_DIGEST=$(echo "$CURRENT_IMAGE" | grep -o 'sha256:[a-f0-9]*' || echo "")
            if [ -n "$CURRENT_DIGEST" ]; then
              BACKUP_TAG="backup-$(date +%Y%m%d-%H%M%S)"
              echo "Creating backup tag: $BACKUP_TAG (digest: $CURRENT_DIGEST)"

              MANIFEST=$(aws ecr batch-get-image \
                --repository-name $ECR_REPOSITORY \
                --image-ids imageDigest=$CURRENT_DIGEST \
                --query 'images[0].imageManifest' \
                --output text)

              aws ecr put-image \
                --repository-name $ECR_REPOSITORY \
                --image-tag $BACKUP_TAG \
                --image-manifest "$MANIFEST" || true
            fi
          fi

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.lambda \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --platform linux/amd64 \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          # 시크릿/변수는 셸 env로 주입하고 jq --arg 로 감싼다.
          # (워크플로 표현식을 스크립트 본문에 직접 펼치면 값에 따옴표/개행이 있을 때 깨진다)
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          KAKAO_APP_ID: ${{ vars.KAKAO_APP_ID }}
          PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
          ADMOB_REWARD_AD_UNIT_IDS: ${{ vars.ADMOB_REWARD_AD_UNIT_IDS }}
        run: |
          echo "Updating Lambda function: $LAMBDA_FUNCTION_NAME"
          echo "New image: $IMAGE_URI"

          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --image-uri $IMAGE_URI \
            --region $AWS_REGION \
            --output json

          echo "Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION

          echo "Updating function configuration..."
          echo "Note: API keys are now managed via AWS Secrets Manager"

          # --- 환경변수 병합 ---
          # update-function-configuration --environment 는 env map 전체를 "치환"한다.
          # 병합하지 않으면 콘솔에서 수동으로 넣어둔 변수가 배포 때마다 전부 날아간다.
          # 병합 규칙: 콘솔에서 수동 설정한 변수는 보존되고, 워크플로에 정의된 키는 워크플로 값이 이긴다.
          # 값이 빈 문자열인 항목(= GitHub vars/secrets 미설정)은 desired 에서 제외해
          # 기존에 설정돼 있던 값을 빈 값으로 덮어쓰지 않도록 한다.
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION \
            --query 'Environment.Variables' \
            --output json)
          if [ -z "$CURRENT_ENV" ] || [ "$CURRENT_ENV" = "null" ]; then
            CURRENT_ENV='{}'
          fi

          DESIRED_ENV=$(jq -n \
            --arg allowed_origins "$ALLOWED_ORIGINS" \
            --arg sentry_dsn "$SENTRY_DSN" \
            --arg kakao_app_id "$KAKAO_APP_ID" \
            --arg play_package_name "$PLAY_PACKAGE_NAME" \
            --arg admob_reward_ad_unit_ids "$ADMOB_REWARD_AD_UNIT_IDS" \
            '{
               USE_DYNAMODB: "true",
               DYNAMODB_TABLE_NAME: "hairme-analysis",
               DYNAMODB_USAGE_TABLE_NAME: "hairstyle_usage",
               ALLOWED_ORIGINS: $allowed_origins,
               LOG_LEVEL: "INFO",
               MODEL_NAME: "gemini-2.5-flash",
               ENVIRONMENT: "production",
               PHOTO_S3_BUCKET: "hairme-photos-364042451408",
               MLOPS_ENABLED: "true",
               MLOPS_S3_BUCKET: "hairme-mlops",
               KAKAO_APP_ID: $kakao_app_id,
               PLAY_PACKAGE_NAME: $play_package_name,
               ADMOB_REWARD_AD_UNIT_IDS: $admob_reward_ad_unit_ids,
               SENTRY_DSN: $sentry_dsn
             } | with_entries(select(.value != ""))')

          jq -n --argjson current "$CURRENT_ENV" --argjson desired "$DESIRED_ENV" \
            '{Variables: ($current + $desired)}' > env.json

          # 값에 시크릿이 포함되므로 키 이름만 로그에 남긴다
          echo "Merged environment variable keys:"
          jq -r '.Variables | keys | join(", ")' env.json

          aws lambda update-function-configuration \
            --function-name $LAMBDA_FUNCTION_NAME \
            --environment file://env.json \
            --memory-size 2048 \
            --timeout 120 \
            --region $AWS_REGION \
            --output json > /dev/null

          rm -f env.json

          echo "Waiting for configuration update to complete..."
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION

          echo "Lambda function updated successfully!"

      - name: Test deployed Lambda function
        run: |
          echo "Testing Lambda function..."

          RESPONSE=$(aws lambda invoke \
            --function-name $LAMBDA_FUNCTION_NAME \
            --payload '{"version":"2.0","requestContext":{"http":{"method":"GET","path":"/api/health","sourceIp":"127.0.0.1","protocol":"HTTP/1.1","userAgent":"deploy-check"}},"rawPath":"/api/health","headers":{}}' \
            --cli-binary-format raw-in-base64-out \
            --region $AWS_REGION \
            response.json)

          echo "Lambda invocation response:"
          echo "$RESPONSE"

          echo "Lambda function output:"
          cat response.json

          if grep -q "healthy" response.json; then
            echo "Health check passed"
          else
            echo "Health check failed - but deployment is complete"
          fi

      - name: Get Lambda function URL
        id: get-url
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION \
            --query 'FunctionUrl' \
            --output text 2>/dev/null || echo "No function URL configured")

          # Function URL 은 공개 엔드포인트이므로 로그에 노출하지 않는다 (step output 으로는 유지)
          echo "::add-mask::$FUNCTION_URL"
          echo "Lambda Function URL retrieved (masked in logs)"
          echo "function_url=$FUNCTION_URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Function Name: $LAMBDA_FUNCTION_NAME"
          echo "Region: $AWS_REGION"
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "Function URL: ${{ steps.get-url.outputs.function_url }}"
          echo "=========================================="

      - name: Send deployment notification
        if: success()
        run: |
          echo "HairMe Backend deployed successfully!"
          echo "Version: ${{ github.sha }}"
          echo "Deployed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  build-and-deploy-beauty:
    name: Build and Deploy Beauty Lambda
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Beauty image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.beauty \
            -t $ECR_REGISTRY/hairme-beauty:$IMAGE_TAG \
            -t $ECR_REGISTRY/hairme-beauty:latest \
            --platform linux/amd64 \
            .

          docker push $ECR_REGISTRY/hairme-beauty:$IMAGE_TAG
          docker push $ECR_REGISTRY/hairme-beauty:latest

          echo "image=$ECR_REGISTRY/hairme-beauty:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Beauty Lambda function
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "Updating Beauty Lambda: hairme-beauty"

          aws lambda update-function-code \
            --function-name hairme-beauty \
            --image-uri $IMAGE_URI \
            --region ap-northeast-2 \
            --output json

          echo "Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name hairme-beauty \
            --region ap-northeast-2

          # --- 환경변수 병합 (hairme-analyze 와 동일한 규칙) ---
          # --environment 는 env map 전체를 치환하므로 기존 값을 읽어와 병합한다.
          # 콘솔에서 수동 설정한 변수는 보존되고, 워크플로에 정의된 키는 워크플로 값이 이긴다.
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name hairme-beauty \
            --region ap-northeast-2 \
            --query 'Environment.Variables' \
            --output json)
          if [ -z "$CURRENT_ENV" ] || [ "$CURRENT_ENV" = "null" ]; then
            CURRENT_ENV='{}'
          fi

          DESIRED_ENV=$(jq -n \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{
               LAMBDA_TYPE: "beauty",
               USE_DYNAMODB: "true",
               DYNAMODB_TABLE_NAME: "hairme-analysis",
               DYNAMODB_USAGE_TABLE_NAME: "hairstyle_usage",
               LOG_LEVEL: "INFO",
               ENVIRONMENT: "production",
               SENTRY_DSN: $sentry_dsn
             } | with_entries(select(.value != ""))')

          jq -n --argjson current "$CURRENT_ENV" --argjson desired "$DESIRED_ENV" \
            '{Variables: ($current + $desired)}' > env-beauty.json

          echo "Merged environment variable keys:"
          jq -r '.Variables | keys | join(", ")' env-beauty.json

          aws lambda update-function-configuration \
            --function-name hairme-beauty \
            --environment file://env-beauty.json \
            --memory-size 2048 \
            --timeout 120 \
            --region ap-northeast-2 \
            --output json > /dev/null

          rm -f env-beauty.json

          echo "Waiting for configuration update to complete..."
          aws lambda wait function-updated \
            --function-name hairme-beauty \
            --region ap-northeast-2

          echo "Beauty Lambda updated successfully!"

      - name: Test Beauty Lambda
        run: |
          RESPONSE=$(aws lambda invoke \
            --function-name hairme-beauty \
            --payload '{"version":"2.0","requestContext":{"http":{"method":"GET","path":"/api/health","sourceIp":"127.0.0.1","protocol":"HTTP/1.1","userAgent":"deploy-check"}},"rawPath":"/api/health","headers":{}}' \
            --cli-binary-format raw-in-base64-out \
            --region ap-northeast-2 \
            response.json)

          echo "Beauty Lambda response:"
          cat response.json
